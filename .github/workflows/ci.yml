name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Create rag_test database
        run: PGPASSWORD=rag psql -h localhost -p 5433 -U rag -d rag -c "CREATE DATABASE rag_test"

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
          VOYAGE_API_KEY: pa-ci-placeholder
        run: uv run pytest -v

  eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Create rag_test database
        run: PGPASSWORD=rag psql -h localhost -p 5433 -U rag -d rag -c "CREATE DATABASE rag_test"

      - name: Run agent evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: uv run python -m app.eval.run_eval

      - name: Upload eval report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: eval_report.html
          if-no-files-found: error
